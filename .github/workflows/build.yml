name: Build and test Notepad++ Syntax Plugin for Foresight Platform Fore
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        autocrlf: ['false', 'true']
        architecture: [x64]
        include:
          - os: windows-latest
            autocrlf: 'false'
            architecture: x86
          - os: windows-latest
            autocrlf: 'true'
            architecture: x86
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set checkout conversion mode
        run: git config --global core.autocrlf ${{ matrix.autocrlf }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify locked bytes and automation line endings
        run: python tools/check_bytes.py
      - name: Check English/Russian documentation and links
        run: python tools/check_docs.py
      - name: Test source selection and release archives
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_release_files.py tests/test_release_archive.py
      - name: Exercise real Git checkout and deterministic source packaging
        run: python tools/checkout_audit.py
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build/cmake -A ${{ matrix.architecture == 'x86' && 'Win32' || 'x64' }}
      - name: Configure Linux
        if: runner.os != 'Windows'
        run: cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cmake --config Release
      - run: ctest --test-dir build/cmake -C Release --output-on-failure
      - name: Inspect freshly built Windows DLL
        if: runner.os == 'Windows'
        run: python tools/inspect_binary.py --dll build/cmake/Release/ForeLexer.dll --report build/cmake/pe-validation.json
      - name: Recheck archived native evidence
        run: python tools/verify.py --architecture ${{ matrix.architecture }}
